[build-system]
# 1.26 reads the SPDX license and license-files fields.
requires = ["hatchling>=1.26", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "dcm_classifier"
dynamic = ["version"]
authors = [
  { name="Michal Brzus", email="michal-brzus@uiowa.edu" },
  { name="Hans Johnson", email="hans-johnson@uiowa.edu" },
  { name="Cavan Riley", email="cavan-riley@uiowa.edu" },
]
description = "Identify the modality and acquisition plane of DICOM MR series from their header fields."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "DICOM",
    "MRI",
    "classification",
    "image modality",
    "acquisition plane",
    "sequence selection",
    "machine learning",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "itk>=5.4.8",
    "itk-core>=5.4.8",
    "itk-filtering>=5.4.8",
    "itk-io>=5.4.8",
    "itk-numerics>=5.4.8",
    "numpy>=2.3.5",
    "onnxruntime>=1.32.0",
    "pandas>=2.2.2",
    "pyarrow>=16.0.0",
    "pydicom>=3.0.2",
    "python-gdcm>=3.0.22", # NOTE: python-gdcm replaces pylibjpeg for plugin support for pydicom
    "tabulate>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/BRAINSia/dcm-classifier"
Documentation = "https://dcm-classifier.readthedocs.io"
"Bug Tracker" = "https://github.com/BRAINSia/dcm-classifier/issues"
Changelog = "https://github.com/BRAINSia/dcm-classifier/releases"
Paper = "https://doi.org/10.1117/12.3006568"

[project.optional-dependencies]
# Needed by the model training scripts and the tutorial notebooks in scripts/.
training = [
    "dicom-anonymizer>=1.0.11",
    "jupyter>=1.0.0",
    "jupyterlab>=4.1.3",
    "matplotlib>=3.8.2",
    "openpyxl>=3.1.5",
    "scikit-learn>=1.4.0",
    "scipy>=1.15.3",
    "skl2onnx>=1.16.0",
]

[dependency-groups]
test = [
    "coverage[toml]>=7.3.2",
    "pytest>=9",
]
docs = [
    "myst-parser>=4.0",
    # Sphinx 9.2 needs Python 3.13; the docs are built with 3.13, and the
    # marker keeps a uv lock for the package's Python 3.12 solvable.
    "sphinx>=9.2; python_version >= '3.13'",
    "sphinx-autodoc-typehints>=3.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-rtd-theme>=3.1",
]
dev = [
    { include-group = "test" },
    "build>=1.2.0",
    "pre-commit>=3.6.0",
    "twine>=5.0.0",
]

[project.scripts]
dcm-classify-study = "dcm_classifier.classify_study:main"

[tool.hatch.version]
# The version comes from the nearest v* git tag.
source = "vcs"

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--showlocals"]
strict = true
log_level = "INFO"
log_cli_level = "INFO"
filterwarnings = [
    "error",
    # Raised by ITK's SWIG bindings at import; as an error it crashes Python.
    "ignore:builtin type swig:DeprecationWarning",
]
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["dcm_classifier"]
relative_files = true
# sys.monitoring is faster; it supports line coverage from Python 3.12.
core = "sysmon"
disable_warnings = ["no-sysmon"]
omit = [
    "**/__init__.py",
]

[tool.coverage.report]
show_missing = true
# The suite covers 89%; fail if that drops by more than a few points.
fail_under = 85

[tool.coverage.html]
directory = "coverage_html_report"

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# These ship without type information.
module = ["itk", "onnxruntime"]
ignore_missing_imports = true

[tool.codespell]
# CHANGELOG.md quotes old commit subjects verbatim.
skip = "*.ipynb,*.onnx,*.dcm,tests/testing_data,CHANGELOG.md"
# TE is the MRI echo time; "Vas collapse flag" is a DICOM private field name.
ignore-words-list = "te,vas"

[tool.ruff]
line-length = 88
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
extend-select = [
    # Rules adopted one per commit, named so each stays enforced.
    "ARG001",  # unused-function-argument
    "ARG005",  # unused-lambda-argument
    "B007",  # unused-loop-control-variable
    "B008",  # function-call-in-default-argument
    "B028",  # no-explicit-stacklevel
    "B904",  # raise-without-from-inside-except
    "B905",  # zip-without-explicit-strict
    "C408",  # unnecessary-collection-call
    "C414",  # unnecessary-double-cast-or-process
    "C416",  # unnecessary-comprehension
    "EM101",  # raw-string-in-exception
    "EM102",  # f-string-in-exception
    "EXE001",  # shebang-not-executable
    "I001",  # unsorted-imports
    "PD002",  # pandas-use-of-inplace-argument
    "PD011",  # pandas-use-of-dot-values
    "PD015",  # pandas-use-of-pd-merge
    "PERF102",  # incorrect-dict-iterator
    "PERF401",  # manual-list-comprehension
    "PERF402",  # manual-list-copy
    "PIE808",  # unnecessary-range-start
    "PLC0415",  # import-outside-top-level
    "PLR1714",  # repeated-equality-comparison
    "PLR5501",  # collapsible-else-if
    "PLW0603",  # global-statement
    "PLW2901",  # redefined-loop-name
    "PT006",  # pytest-parametrize-names-wrong-type
    "PT011",  # pytest-raises-too-broad
    "PT018",  # pytest-composite-assertion
    "PT030",  # pytest-warns-too-broad
    "PT031",  # pytest-warns-with-multiple-statements
    "PTH100",  # os-path-abspath
    "PTH110",  # os-path-exists
    "PTH123",  # builtin-open
    "PTH207",  # glob
    "RET504",  # unnecessary-assign
    "RET505",  # superfluous-else-return
    "RET506",  # superfluous-else-raise
    "RET508",  # superfluous-else-break
    "RUF005",  # collection-literal-concatenation
    "RUF012",  # mutable-class-default
    "RUF013",  # implicit-optional
    "RUF015",  # unnecessary-iterable-allocation-for-first-element
    "RUF059",  # unused-unpacked-variable
    "SIM101",  # duplicate-isinstance-call
    "SIM102",  # collapsible-if
    "SIM103",  # needless-bool
    "SIM108",  # if-else-block-instead-of-if-exp
    "SIM114",  # if-with-same-arms
    "SIM118",  # in-dict-keys
    "TRY003",  # raise-vanilla-args
    "TRY004",  # type-check-without-type-error
    "TRY201",  # verbose-raise
    "TRY300",  # try-consider-else
    # Rule families recommended by the Scientific Python guide.
    "ARG",  # flake8-unused-arguments
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "EM",  # flake8-errmsg
    "EXE",  # flake8-executable
    "FURB",  # refurb
    "G",  # flake8-logging-format
    "I",  # isort
    "ICN",  # flake8-import-conventions
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "NPY",  # NumPy specific rules
    "PD",  # pandas-vet
    "PERF",  # perflint
    "PGH",  # pygrep-hooks
    "PL",  # pylint
    "PT",  # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "PYI",  # flake8-pyi
    "Q",  # flake8-quotes
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # Ruff-specific
    "SIM",  # flake8-simplify
    "SLOT",  # flake8-slots
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "TC",  # flake8-type-checking
    "TRY",  # tryceratops
    "UP",  # pyupgrade
]
ignore = [
    "PLR09",  # Too many <...>
    "PLR2004",  # Magic value used in comparison
    "TRY301",  # the splitter's handler re-raises or reports what it raises
    # Malformed DICOM headers fail in ways no exception list anticipates; the
    # broad handlers turn them into sentinel values instead of failing a study.
    "BLE001",  # blind-except
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
# Command line tools report by printing; the library logs.
"scripts/**" = ["T201"]
"src/dcm_classifier/classify_study.py" = ["T201"]
