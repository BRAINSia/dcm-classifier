[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcm_classifier"
version = '0.9.9'
authors = [
  { name="Michal Brzus", email="michal-brzus@uiowa.edu" },
  { name="Hans Johnson", email="hans-johnson@uiowa.edu" },
  { name="Cavan Riley", email="cavan-riley@uiowa.edu" },
]
description = "This is a consolidation of work from NAMIC efforts primarily at the University of Iowa."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "deprecation>=2.1.0",
    "itk>=5.4.8",
    "itk-core>=5.4.8",
    "itk-filtering>=5.4.8",
    "itk-io>=5.4.8",
    "itk-numerics>=5.4.8",
    "numpy>=2.0.0",
    "onnxruntime>=1.19.0",
    "pandas>=2.2.2",
    "pyarrow>=16.0.0",
    "pydicom>=3.0.0",
    "python-gdcm>=3.0.22", # NOTE: python-gdcm replaces pylibjpeg for plugin support for pydicom
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
# Needed by the model training scripts and the tutorial notebooks in scripts/.
training = [
    "dicom-anonymizer>=1.0.11",
    "jupyter>=1.0.0",
    "jupyterlab>=4.1.3",
    "matplotlib>=3.8.2",
    "openpyxl>=3.1.2",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "skl2onnx>=1.16.0",
]

[dependency-groups]
test = [
    "coverage[toml]>=7.3.2",
    "pytest>=8",
]
dev = [
    { include-group = "test" },
    "build>=1.2.0",
    "pre-commit>=3.6.0",
    "twine>=5.0.0",
]

[project.scripts]
dcm-classify-study = "dcm_classifier.classify_study:main"

[tool.hatchling.data]
include = ["models/ova_rf_classifier.onnx"]

[tool.pytest.ini_options]
minversion = "8"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
log_level = "INFO"
log_cli_level = "INFO"
filterwarnings = [
    "error",
    # Raised by ITK's SWIG bindings at import; as an error it crashes Python.
    "ignore:builtin type swig:DeprecationWarning",
]
pythonpath = [
  "src",
  "src/dcm_classifier"
]
# NOTE tests/__init__.py is empty.  passing it as the config files
# silences warnings about missing config.py and config-3.py files
# pytest-cov breaks code python debugger addopts = "--cov "
testpaths = [
    "tests"
]

[tool.coverage.run]
omit = [
    "**/__init__.py",
    "scripts/**",
    "models/**",
    "tests/**",
    "**/example_image_processing.py",
    ]
source = [
    "src/dcm_classifier"
]

[tool.coverage.html]
directory = "coverage_html_report"

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# These ship without type information.
module = ["deprecation", "itk", "onnxruntime"]
ignore_missing_imports = true

[tool.codespell]
# CHANGELOG.md quotes old commit subjects verbatim.
skip = "*.ipynb,*.onnx,*.dcm,tests/testing_data,CHANGELOG.md"
# TE is the MRI echo time; "Vas collapse flag" is a DICOM private field name.
ignore-words-list = "te,vas"

[tool.ruff]
line-length = 88
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
extend-select = [
    # Rules adopted one per commit, named so each stays enforced.
    "ARG005",  # unused-lambda-argument
    "B007",  # unused-loop-control-variable
    "B008",  # function-call-in-default-argument
    "B028",  # no-explicit-stacklevel
    "B904",  # raise-without-from-inside-except
    "B905",  # zip-without-explicit-strict
    "C408",  # unnecessary-collection-call
    "C414",  # unnecessary-double-cast-or-process
    "C416",  # unnecessary-comprehension
    "EM101",  # raw-string-in-exception
    "EM102",  # f-string-in-exception
    "EXE001",  # shebang-not-executable
    "I001",  # unsorted-imports
    "PD002",  # pandas-use-of-inplace-argument
    "PD011",  # pandas-use-of-dot-values
    "PD015",  # pandas-use-of-pd-merge
    "PERF102",  # incorrect-dict-iterator
    "PERF401",  # manual-list-comprehension
    "PERF402",  # manual-list-copy
    "PIE808",  # unnecessary-range-start
    "PLC0415",  # import-outside-top-level
    "PLR1714",  # repeated-equality-comparison
    "PLR5501",  # collapsible-else-if
    "PLW2901",  # redefined-loop-name
    "PT006",  # pytest-parametrize-names-wrong-type
    "PT011",  # pytest-raises-too-broad
    "PT018",  # pytest-composite-assertion
    "PT030",  # pytest-warns-too-broad
    "PT031",  # pytest-warns-with-multiple-statements
    "PTH100",  # os-path-abspath
    "PTH110",  # os-path-exists
    "PTH123",  # builtin-open
    "PTH207",  # glob
    "RET504",  # unnecessary-assign
    "RET505",  # superfluous-else-return
    "RET506",  # superfluous-else-raise
    "RET508",  # superfluous-else-break
    "RUF005",  # collection-literal-concatenation
    "RUF012",  # mutable-class-default
    "RUF013",  # implicit-optional
    "RUF015",  # unnecessary-iterable-allocation-for-first-element
    "RUF059",  # unused-unpacked-variable
    "SIM101",  # duplicate-isinstance-call
    "SIM102",  # collapsible-if
    "SIM103",  # needless-bool
    "SIM108",  # if-else-block-instead-of-if-exp
    "SIM114",  # if-with-same-arms
    "SIM118",  # in-dict-keys
    "TRY201",  # verbose-raise
    "TRY300",  # try-consider-else
    # Rule families recommended by the Scientific Python guide.
    "ARG",  # flake8-unused-arguments
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "EM",  # flake8-errmsg
    "EXE",  # flake8-executable
    "FURB",  # refurb
    "G",  # flake8-logging-format
    "I",  # isort
    "ICN",  # flake8-import-conventions
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "NPY",  # NumPy specific rules
    "PD",  # pandas-vet
    "PERF",  # perflint
    "PGH",  # pygrep-hooks
    "PL",  # pylint
    "PT",  # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "PYI",  # flake8-pyi
    "Q",  # flake8-quotes
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # Ruff-specific
    "SIM",  # flake8-simplify
    "SLOT",  # flake8-slots
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "TC",  # flake8-type-checking
    "TRY",  # tryceratops
    "UP",  # pyupgrade
]
ignore = [
    "PLR09",  # Too many <...>
    "PLR2004",  # Magic value used in comparison
    "T201",  # `print` found; printing is how the command line tools report
    "TRY301",  # the splitter's handler re-raises or reports what it raises
    # Fixing these changes what callers see, so each needs a decision first.
    "ARG001",  # unused arguments are part of public and callback signatures
    "BLE001",  # broad handlers report an unreadable file and carry on
    "PLW0603",  # module-level state in a training script
    "TRY003",  # messages would move into custom exception classes
    "TRY004",  # TypeError for wrong types changes the exceptions raised
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
