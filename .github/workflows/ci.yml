name: CI
on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      # Codecov authenticates the upload with a GitHub OIDC token, not a secret.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install . --group test
      - run: python -m coverage run -m pytest
      - run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - run: python -m coverage xml
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          use_oidc: true

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Sphinx 9.2 needs Python 3.13; the package is tested on 3.12 and 3.14.
          python-version: "3.13"
          activate-environment: true
          cache-dependency-glob: pyproject.toml
      # Read the Docs runs uv sync, which must resolve for every supported Python.
      - run: uv lock --dry-run
      - run: uv pip install . --group docs
      - run: python -m sphinx -W --keep-going -b html docs/source docs/_build/html

  lowest-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          activate-environment: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: lowest
      - run: uv pip install --resolution lowest-direct . --group test
      - run: python -m pytest

  # The one check branch protection needs to require.
  pass:
    if: always()
    needs: [pre-commit, tests, docs, lowest-dependencies]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
