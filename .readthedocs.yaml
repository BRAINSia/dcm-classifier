# Read the Docs configuration:
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    # The version comes from git tags, which a shallow clone lacks.
    post_checkout:
      - git fetch --unshallow || true

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
